# Plantillas de mensajes (Apache Commons Text StringSubstitutor, sintaxis ${variable}).
# Archivo leido en UTF-8 por RejectionMessageFactory; la aplicacion no arranca si falta alguna clave.
# Los montos se formatean con locale es-MX y 2 decimales (p. ej. 25,000.00).

# Rechazos de transferencia (422)
PER_OPERATION_LIMIT_EXCEEDED=El monto ${amount} ${currency} excede el límite por operación de ${perOperationLimit} ${currency} para el canal ${channel}.
DAILY_LIMIT_EXCEEDED=El monto ${amount} ${currency} excede el disponible diario de ${available} ${currency} (límite ${dailyLimit}, consumido ${consumed}) para el canal ${channel}.

# Otros Problem Details (campo detail)
VALIDATION_ERROR=La solicitud contiene campos inválidos.
ACCOUNT_LIMITS_NOT_FOUND=La cuenta ${accountId} no tiene límites configurados.
LIMIT_NOT_FOUND=La cuenta ${accountId} no tiene límite configurado para el canal ${channel}.
TRANSFER_ID_CONFLICT=El transferId ${transferId} ya fue utilizado con datos distintos.
INVALID_LIMIT_CONFIGURATION=El límite por operación (${perOperationLimit} ${currency}) no puede ser mayor que el límite diario (${dailyLimit} ${currency}).
INVALID_LIMIT_CONFIGURATION_GENERIC=La configuración de límites del canal ${channel} es inválida: los límites deben ser no negativos, con máximo 2 decimales, y el límite por operación no puede ser mayor que el diario.
CONCURRENT_UPDATE=El recurso fue modificado por otra solicitud concurrente; vuelva a intentarlo.
INTERNAL_ERROR=Ocurrió un error interno inesperado. Use el traceId para reportarlo.
