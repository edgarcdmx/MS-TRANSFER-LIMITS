# MS-TRANSFER-LIMITS - application configuration (Spring Boot 4.2).
# Property names verified against the Boot 4.2.0 configuration metadata
# (META-INF/spring-configuration-metadata.json of each spring-boot-* module).

spring:
  application:
    name: ms-transfer-limits
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transfer_limits}
    username: ${DB_USERNAME:transfer}
    # No default: the password must come from the environment (DB_PASSWORD).
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Request schemas declare additionalProperties: false (openapi.yaml): unknown fields -> 400.
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

transfer-limits:
  business-zone: America/Mexico_City

management:
  endpoints:
    web:
      exposure:
        # No Prometheus registry on the classpath, so expose the generic metrics endpoint.
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Default for local runs. Boot maps the standard OTel variables over this value with
          # higher precedence: OTEL_EXPORTER_OTLP_ENDPOINT (base URL, Boot appends /v1/traces)
          # or OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (full URL).
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        # Only traces go to the collector; avoid connection noise when none is running.
        enabled: false
  logging:
    export:
      otlp:
        # Jaeger does not accept OTLP logs; logs stay on stdout.
        enabled: false

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI renders the contract-first specification served as a static resource.
    url: /openapi/openapi.yaml

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/transfer_limits}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4318/v1/traces
