# Local stack: PostgreSQL 18 + Jaeger v2 (OTLP receiver and UI) + the service.
#   cp env.example .env   # then set a real POSTGRES_PASSWORD (required, no default)
#   docker compose up --build
# Published ports are bound to 127.0.0.1 only (not reachable from the network).
#   API / Swagger UI: http://localhost:8080/swagger-ui.html
#   Jaeger UI:        http://localhost:16686
name: ms-transfer-limits

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: transfer_limits
      POSTGRES_USER: ${POSTGRES_USER:-transfer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    environment:
      # Already the image default; explicit so OTLP listens on the compose network.
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-transfer-limits:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/transfer_limits
      DB_USERNAME: ${POSTGRES_USER:-transfer}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see env.example)}
      # Standard OTel variable (base URL); Spring Boot appends /v1/traces.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
